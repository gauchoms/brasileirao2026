<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart Race · {{ bolao.nome }}</title>
<meta property="og:title"       content="🏆 {{ bolao.nome }} — Chart Race">
<meta property="og:description" content="Veja o ranking animado do bolão jogo a jogo!">
<meta property="og:type"        content="website">
<meta property="og:url"         content="{{ request.url }}">

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

<style>
:root {
  --bg:#0d0d0f; --card:#161618; --border:#252528;
  --green:#00e676; --green-dim:#00e67618;
  --text:#e0e0e8; --muted:#505060;
  --gold:#FFD700; --silver:#C0C0C0; --bronze:#CD7F32;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;min-height:100vh}
#app{max-width:880px;margin:0 auto;padding:1rem 1rem 2rem}

.header{text-align:center;padding:.8rem 0 .2rem}
.bolao-nome{font-size:1.35rem;font-weight:700}
.jogo-label{margin-top:.35rem;display:inline-block;font-size:.75rem;
  color:var(--green);background:var(--green-dim);border:1px solid #00e67628;
  padding:.22rem .85rem;border-radius:20px}
.jogo-counter{font-size:.62rem;color:var(--muted);margin-top:.2rem}

.tabs{display:flex;border-bottom:1px solid var(--border);margin:.9rem 0 0}
.tab{padding:.5rem 1.3rem;font-size:.8rem;cursor:pointer;border:none;
  background:none;color:var(--muted);border-bottom:2px solid transparent;transition:all .2s;font-weight:500}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.tab:hover:not(.active){color:var(--text)}

.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center;margin:.7rem 0}
.btn{padding:.38rem .8rem;background:var(--card);color:var(--muted);
  border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.82rem;transition:all .15s}
.btn:hover:not(:disabled){border-color:var(--green);color:var(--text)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.primary{background:var(--green);color:#000;border-color:var(--green);font-weight:700}
.btn.stop{background:#c0392b;color:#fff;border-color:#c0392b;font-weight:700}

.progress-wrap{width:100%;display:flex;align-items:center;gap:8px;margin:.25rem 0}
.progress-wrap input[type=range]{flex:1;accent-color:var(--green)}
.progress-wrap span{font-size:.62rem;color:var(--muted);min-width:16px}

.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin:.25rem 0 .7rem}
.dot{width:10px;height:10px;border-radius:50%;cursor:pointer;flex-shrink:0;transition:background .2s}

#bar-container svg{display:block}
#line-container svg{width:100%;display:block}

.export-row{display:flex;gap:8px;justify-content:center;margin:.6rem 0;flex-wrap:wrap}
.export-status{font-size:.7rem;color:var(--muted);text-align:center;min-height:16px;margin:.2rem 0}

.loading{display:flex;align-items:center;justify-content:center;
  height:60vh;flex-direction:column;gap:1rem;color:var(--muted)}
.ld{width:9px;height:9px;border-radius:50%;background:var(--green);
  animation:pu 1.2s infinite;display:inline-block;margin:0 3px}
.ld:nth-child(2){animation-delay:.2s}.ld:nth-child(3){animation-delay:.4s}
@keyframes pu{0%,80%,100%{opacity:.15}40%{opacity:1}}

.tooltip{position:fixed;background:#1a1a1e;border:1px solid var(--border);
  border-radius:6px;padding:6px 10px;font-size:.7rem;pointer-events:none;
  z-index:100;display:none;line-height:1.6}

footer{text-align:center;font-size:.6rem;color:#222;margin:.8rem 0 0}
</style>
</head>
<body>
<div id="app">
  <div class="loading" id="loading">
    <div><span class="ld"></span><span class="ld"></span><span class="ld"></span></div>
    <div>Carregando dados...</div>
  </div>
  <div id="main" style="display:none">
    <div class="header">
      <div class="bolao-nome">🏆 <span id="bolao-nome"></span></div>
      <div><span class="jogo-label" id="jogo-label"></span></div>
      <div class="jogo-counter" id="jogo-counter"></div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-bar" onclick="switchTab('bar')">📊 Bar Race</button>
      <button class="tab"        id="tab-line" onclick="switchTab('line')">📈 Line Race</button>
    </div>

    <div class="controls">
      <button class="btn" id="btn-prev" onclick="stepFrame(-1)">←</button>
      <button class="btn primary" id="btn-play" onclick="togglePlay()">▶ Play</button>
      <button class="btn" id="btn-next" onclick="stepFrame(1)">→</button>
    </div>

    <div class="progress-wrap">
      <span>1</span>
      <input type="range" id="slider" min="0" value="0" oninput="onSlider(this.value)">
      <span id="slider-max">1</span>
    </div>
    <div class="dots" id="dots"></div>

    <div id="bar-view"><div id="bar-container"></div></div>
    <div id="line-view" style="display:none"><div id="line-container"></div></div>

    <div class="export-row">
      <button class="btn" onclick="exportWebM()">🎬 Exportar Vídeo (WebM)</button>
      <button class="btn" onclick="exportFrames()">🖼️ Exportar PNG atual</button>
      <a class="btn" href="/chartrace/{{ bolao.id }}/csv" download>📥 Baixar CSV (Flourish)</a>
    </div>
    <div class="export-status" id="export-status"></div>

    <footer>erreidenovo.com.br</footer>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
window.CHARTRACE_BOLAO_ID = {{ bolao.id }};
window.CHARTRACE_BOLAO_NOME = "{{ bolao.nome | e }}";

// ── PALETA ──────────────────────────────────────────────────────────────────
const PALETTE = [
  "#00e676","#2196F3","#FF5722","#FFC107","#9C27B0",
  "#00BCD4","#FF4081","#8BC34A","#FF9800","#3F51B5",
  "#E91E63","#009688","#CDDC39","#F44336","#607D8B",
  "#03A9F4","#4CAF50","#FF6F00","#76FF03","#EA80FC",
  "#00E5FF","#FFAB40","#69F0AE","#40C4FF","#FF6E40",
  "#B2FF59","#FFD740","#E040FB","#795548","#607D8B"
];
const EMOJIS = ["🏆","⭐","⚽","🔥","💪","⚡","🎯","🌟","👟","🏅",
                 "🥅","💎","🚀","👑","🎪","🦁","🐯","🦊","🐻","🦅",
                 "🦋","🌈","🏄","🎸","🧨","🎲","🏹","🎳","🎀","🔮"];

// ── ESTADO ──────────────────────────────────────────────────────────────────
let DATA = null;
let colorMap = {}, emojiMap = {};

// Tempo global contínuo: de 0 até DATA.keyframes.length
// Cada inteiro = início de um keyframe
// 0.5 = meio do keyframe 0→1, etc.
let T = 0;                  // tempo global atual
const T_PER_KF = 14;       // segundos por keyframe (lento o suficiente)
let playing = false;
let rafId = null;
let lastTs = null;
let tab = 'bar';
let isExporting = false;

// valores interpolados
let curVals = {};

function smoothStep(t){ return t*t*(3-2*t); }

function getValsAt(T_global) {
  const nKF = DATA.keyframes.length;
  const kfIdx = Math.min(Math.floor(T_global), nKF - 1);
  const prog   = T_global - Math.floor(T_global);

  const prev = kfIdx > 0
    ? DATA.keyframes[kfIdx - 1].pts
    : Object.fromEntries(DATA.participantes.map(p => [p.id, 0]));
  const curr = DATA.keyframes[kfIdx].pts;

  const e = smoothStep(Math.min(prog, 1));
  const vals = {};
  DATA.participantes.forEach(p => {
    const a = prev[p.id] ?? 0;
    const b = curr[p.id] ?? 0;
    vals[p.id] = a + (b - a) * e;
  });
  return vals;
}

function getKFIndex() {
  if (!DATA) return 0;
  return Math.min(Math.floor(T), DATA.keyframes.length - 1);
}

// ── LOAD ────────────────────────────────────────────────────────────────────
fetch(`/chartrace/${window.CHARTRACE_BOLAO_ID}/data`)
  .then(r => r.json())
  .then(d => {
    DATA = d;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    document.getElementById('bolao-nome').textContent = d.bolao;
    document.getElementById('slider').max = d.keyframes.length - 1;
    document.getElementById('slider-max').textContent = d.keyframes.length;

    d.participantes.forEach((p, i) => {
      colorMap[p.id] = PALETTE[i % PALETTE.length];
      emojiMap[p.id] = EMOJIS[i % EMOJIS.length];
    });

    curVals = Object.fromEntries(d.participantes.map(p => [p.id, 0]));

    buildDots();
    buildBarChart();
    buildLineChart();
    updateHeader();
    renderBar(curVals);
    renderLine(0);

    setTimeout(() => startPlay(), 500);
  })
  .catch(e => {
    document.getElementById('loading').innerHTML =
      `<div style="color:#e74c3c">Erro: ${e.message}</div>`;
  });

// ── DOTS ────────────────────────────────────────────────────────────────────
function buildDots() {
  const wrap = document.getElementById('dots');
  wrap.innerHTML = '';
  DATA.keyframes.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.title = DATA.keyframes[i].label;
    d.onclick = () => { pause(); jumpToKF(i); };
    wrap.appendChild(d);
  });
  updateDots();
}

function updateDots() {
  const kfi = getKFIndex();
  const dots = document.getElementById('dots').children;
  for (let i = 0; i < dots.length; i++) {
    dots[i].style.background = i === kfi ? 'var(--green)'
      : i < kfi ? '#00e67640' : '#2a2a2e';
    dots[i].style.border = i === kfi ? '2px solid var(--green)' : '1px solid #333';
  }
}

// ── HEADER ──────────────────────────────────────────────────────────────────
function updateHeader() {
  const kfi = getKFIndex();
  const kf = DATA.keyframes[kfi];
  document.getElementById('jogo-label').textContent = kf ? kf.label : '';
  document.getElementById('jogo-counter').textContent =
    `Jogo ${kfi + 1} de ${DATA.keyframes.length}`;
  document.getElementById('slider').value = kfi;
  updateDots();
}

// ── PLAYBACK ────────────────────────────────────────────────────────────────
function startPlay() {
  if (!DATA) return;
  const maxT = DATA.keyframes.length - 0.001;
  if (T >= maxT) { T = 0; }
  playing = true;
  lastTs = null;
  document.getElementById('btn-play').textContent = '⏸ Pausar';
  document.getElementById('btn-play').className = 'btn stop';
  rafId = requestAnimationFrame(animLoop);
}

function pause() {
  playing = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  const atEnd = DATA && T >= DATA.keyframes.length - 0.01;
  document.getElementById('btn-play').textContent = atEnd ? '🔄 Reiniciar' : '▶ Play';
  document.getElementById('btn-play').className = 'btn primary';
}

function togglePlay() { if (playing) pause(); else startPlay(); }

function animLoop(ts) {
  if (!playing) return;
  if (!lastTs) lastTs = ts;
  const dt = (ts - lastTs) / 1000;
  lastTs = ts;

  const maxT = DATA.keyframes.length - 0.001;
  T = Math.min(T + dt / T_PER_KF, maxT);

  curVals = getValsAt(T);
  updateHeader();
  renderBar(curVals);
  renderLine(T);

  if (T >= maxT) { pause(); return; }
  rafId = requestAnimationFrame(animLoop);
}

function stepFrame(dir) {
  pause();
  const kfi = Math.max(0, Math.min(DATA.keyframes.length - 1, getKFIndex() + dir));
  jumpToKF(kfi);
}

function jumpToKF(kfi) {
  T = kfi;
  curVals = getValsAt(T);
  updateHeader();
  renderBar(curVals);
  renderLine(T);
}

function onSlider(val) {
  pause();
  jumpToKF(parseInt(val));
}

// ── TABS ────────────────────────────────────────────────────────────────────
function switchTab(t) {
  tab = t;
  document.getElementById('bar-view').style.display  = t === 'bar'  ? '' : 'none';
  document.getElementById('line-view').style.display = t === 'line' ? '' : 'none';
  document.getElementById('tab-bar').className  = 'tab' + (t === 'bar'  ? ' active' : '');
  document.getElementById('tab-line').className = 'tab' + (t === 'line' ? ' active' : '');
  if (t === 'bar')  renderBar(curVals);
  if (t === 'line') renderLine(T);
}

// ══════════════════════════════════════════════════════════════════════════
// BAR RACE
// ══════════════════════════════════════════════════════════════════════════
const BAR_H = 44, BAR_GAP = 8, SLOT = BAR_H + BAR_GAP;
const MAX_BARS = 50;
const LW = 165, PW = 56;
const BM = { top:4, right:PW+10, bottom:4, left:LW+10 };

let bSvg, bInnerW, bH;

function buildBarChart() {
  const wrap = document.getElementById('bar-container');
  wrap.innerHTML = '';
  const n = Math.min(DATA.participantes.length, MAX_BARS);
  const W = wrap.clientWidth || 820;
  bInnerW = W - BM.left - BM.right;
  bH = n * SLOT + BM.top + BM.bottom;

  bSvg = d3.select('#bar-container').append('svg')
    .attr('width', W).attr('height', bH);

  const g = bSvg.append('g').attr('transform', `translate(${BM.left},${BM.top})`);

  DATA.participantes.slice(0, MAX_BARS).forEach((p, pi) => {
    const cor = colorMap[p.id];
    const gr  = g.append('g').attr('class', `bg${p.id}`);

    // bg track
    gr.append('rect').attr('class','tbg')
      .attr('y',(SLOT-BAR_H)/2).attr('height',BAR_H).attr('rx',5)
      .attr('fill','#1a1a1e').attr('width', bInnerW);

    // fill
    gr.append('rect').attr('class','tf')
      .attr('y',(SLOT-BAR_H)/2).attr('height',BAR_H).attr('rx',5)
      .attr('fill',cor).attr('width',0);

    // emoji
    gr.append('text').attr('class','te')
      .attr('x',-LW+2).attr('y',SLOT/2)
      .attr('dominant-baseline','middle').attr('font-size','1.05rem')
      .text(emojiMap[p.id]);

    // pos
    gr.append('text').attr('class','tp')
      .attr('x',-LW+28).attr('y',SLOT/2)
      .attr('dominant-baseline','middle')
      .attr('font-size','.63rem').attr('font-family','Segoe UI,Arial,sans-serif');

    // nome
    gr.append('text').attr('class','tn')
      .attr('x',-8).attr('y',SLOT/2)
      .attr('text-anchor','end').attr('dominant-baseline','middle')
      .attr('fill','#999').attr('font-size','.68rem')
      .attr('font-family','Segoe UI,Arial,sans-serif')
      .text(p.nome.length > 18 ? p.nome.slice(0,17)+'…' : p.nome);

    // pts
    gr.append('text').attr('class','tpt')
      .attr('x', bInnerW+7).attr('y',SLOT/2)
      .attr('dominant-baseline','middle').attr('font-weight','700')
      .attr('font-size','.8rem').attr('font-family','Segoe UI,Arial,sans-serif')
      .attr('fill',cor);
  });
}

function renderBar(vals) {
  if (!bSvg || !DATA) return;
  const n = Math.min(DATA.participantes.length, MAX_BARS);
  const parts = DATA.participantes.slice(0, n);
  const sorted = [...parts]
    .map(p => ({...p, val: vals[p.id] ?? 0}))
    .sort((a,b) => b.val - a.val || a.id - b.id);
  const maxVal = Math.max(...sorted.map(p => p.val), 1);
  const xScale = d3.scaleLinear().domain([0,maxVal]).range([0,bInnerW]);

  sorted.forEach((p, rank) => {
    const cor = colorMap[p.id];
    const gr  = bSvg.select(`.bg${p.id}`);
    const posC = rank===0?'var(--gold)':rank===1?'var(--silver)':rank===2?'var(--bronze)':'#3a3a44';

    // posição vertical — transição suave
    gr.transition().duration(120).ease(d3.easeLinear)
      .attr('transform', `translate(0,${rank * SLOT})`);

    // largura da barra — transição suave
    gr.select('.tf').transition().duration(100).ease(d3.easeLinear)
      .attr('width', Math.max(xScale(p.val), 0));

    gr.select('.tp').attr('fill', posC).attr('font-weight', rank<3?'700':'400')
      .text(`${rank+1}º`);

    gr.select('.tpt').text(Math.round(p.val)+' pts');
  });
}

// ══════════════════════════════════════════════════════════════════════════
// LINE RACE — crescimento contínuo
// ══════════════════════════════════════════════════════════════════════════
const LM = { top:20, right:130, bottom:38, left:50 };
let lSvg, lX, lY, lG, lInnerW, lInnerH, lW, lH;

function buildLineChart() {
  const wrap = document.getElementById('line-container');
  wrap.innerHTML = '';
  lW = wrap.clientWidth || 820;
  lH = Math.max(360, Math.min(480, window.innerHeight * 0.52));
  lInnerW = lW - LM.left - LM.right;
  lInnerH = lH - LM.top  - LM.bottom;

  lSvg = d3.select('#line-container').append('svg')
    .attr('width', lW).attr('height', lH);

  const defs = lSvg.append('defs');
  defs.append('clipPath').attr('id','lclip')
    .append('rect').attr('width', lInnerW+2).attr('height', lInnerH+10).attr('y',-5);

  lG = lSvg.append('g').attr('transform', `translate(${LM.left},${LM.top})`);

  // X: de 0 até número total de jogos - 1 (fixo desde o início)
  const nKF = DATA.keyframes.length;
  lX = d3.scaleLinear().domain([0, nKF - 1]).range([0, lInnerW]);

  // Y: placeholder - atualizado no render
  lY = d3.scaleLinear().domain([0, 100]).range([lInnerH, 0]);

  // grade
  lG.append('g').attr('class','gy');

  // eixo X — labels de jogo, fixos
  const xAxis = d3.axisBottom(lX)
    .ticks(Math.min(nKF, 12))
    .tickFormat(i => `J${Math.round(i)+1}`);
  lG.append('g').attr('class','ax')
    .attr('transform', `translate(0,${lInnerH})`)
    .call(xAxis)
    .selectAll('text').attr('fill','#444').attr('font-size','.6rem');
  lG.select('.ax').select('.domain').attr('stroke','#252528');
  lG.select('.ax').selectAll('.tick line').attr('stroke','#252528');

  // eixo Y
  lG.append('g').attr('class','ay');

  // área de linhas (clipped)
  lG.append('g').attr('class','lines').attr('clip-path','url(#lclip)');

  // labels à direita
  lG.append('g').attr('class','lbls');

  // tooltip overlay
  lG.append('rect')
    .attr('width', lInnerW).attr('height', lInnerH)
    .attr('fill','transparent')
    .on('mousemove', onLineHover)
    .on('mouseleave', () => { document.getElementById('tooltip').style.display='none'; });
}

function renderLine(T_global) {
  if (!lSvg || !DATA) return;
  const nKF  = DATA.participantes.length > 0 ? DATA.keyframes.length : 1;
  const parts = DATA.participantes;

  // máximo Y de todos os keyframes
  let maxPts = 10;
  DATA.keyframes.forEach(kf => {
    parts.forEach(p => { if ((kf.pts[p.id]??0) > maxPts) maxPts = kf.pts[p.id]; });
  });
  lY.domain([0, maxPts * 1.08]);

  // atualiza eixo Y
  const yAxis = d3.axisLeft(lY).ticks(6).tickFormat(d => d+'pts');
  lG.select('.ay').call(yAxis)
    .selectAll('text').attr('fill','#444').attr('font-size','.6rem');
  lG.select('.ay').select('.domain').attr('stroke','#252528');
  lG.select('.ay').selectAll('.tick line').attr('stroke','#252528');

  // grade Y
  lG.select('.gy').call(
    d3.axisLeft(lY).ticks(6).tickSize(-lInnerW).tickFormat('')
  ).selectAll('line').attr('stroke','#1a1a1e').attr('stroke-dasharray','3,3');
  lG.select('.gy').select('.domain').remove();

  const linesG = lG.select('.lines');
  const lblsG  = lG.select('.lbls');

  parts.forEach((p) => {
    const cor = colorMap[p.id];

    // Construir array de pontos do eixo X = 0 até T_global
    // X é contínuo: a cada unidade = 1 jogo
    // Para T_global = 2.5: temos ponto em 0, 1, 2 (do histórico) e 2.5 (interpolado)
    const kfiCur = Math.min(Math.floor(T_global), DATA.keyframes.length - 1);
    const prog   = T_global - Math.floor(T_global);

    // pontos históricos: x=0..kfiCur-1 com valores reais
    const points = [];
    // ponto de origem
    points.push([0, 0]);
    for (let i = 0; i <= kfiCur; i++) {
      const xPos = i; // x contínuo = índice do jogo
      let yVal;
      if (i < kfiCur) {
        yVal = DATA.keyframes[i].pts[p.id] ?? 0;
      } else {
        // ponto atual interpolado
        yVal = curVals[p.id] ?? 0;
      }
      // evitar duplicar ponto 0
      if (i === 0) points[0] = [0, yVal === 0 && T_global < 0.01 ? 0 : yVal];
      else points.push([xPos, yVal]);
    }

    // linha
    const lineGen = d3.line()
      .x(d => lX(d[0]))
      .y(d => lY(d[1]))
      .curve(d3.curveCatmullRom.alpha(0.5));

    let path = linesG.select(`.lp${p.id}`);
    if (path.empty()) {
      path = linesG.append('path').attr('class',`lp${p.id}`)
        .attr('fill','none').attr('stroke-width',2.2)
        .attr('stroke-linecap','round').attr('stroke-linejoin','round');
    }
    path.attr('stroke', cor).attr('d', lineGen(points));

    // dot no fim da linha
    const lastPt = points[points.length - 1];
    let dot = linesG.select(`.ld${p.id}`);
    if (dot.empty()) {
      dot = linesG.append('circle').attr('class',`ld${p.id}`).attr('r',3.5);
    }
    dot.attr('cx', lX(lastPt[0])).attr('cy', lY(lastPt[1])).attr('fill', cor);

    // label à direita
    const curPts = Math.round(curVals[p.id] ?? 0);
    let lbl = lblsG.select(`.ll${p.id}`);
    if (lbl.empty()) {
      lbl = lblsG.append('text').attr('class',`ll${p.id}`)
        .attr('font-size','.6rem').attr('font-family','Segoe UI,Arial,sans-serif')
        .attr('dominant-baseline','middle');
    }
    lbl.attr('x', lX(lastPt[0]) + 6)
       .attr('y', lY(lastPt[1]))
       .attr('fill', cor)
       .text(`${p.nome.split(' ')[0]} ${curPts}`);
  });

  // Anti-colisão básica dos labels (ordena por Y e empurra)
  const lblNodes = [];
  lblsG.selectAll('text').each(function() { lblNodes.push(this); });
  const MIN_GAP = 11;
  // ordena por y atual
  lblNodes.sort((a,b) => +d3.select(a).attr('y') - +d3.select(b).attr('y'));
  for (let i = 1; i < lblNodes.length; i++) {
    const prev = +d3.select(lblNodes[i-1]).attr('y');
    const cur  = +d3.select(lblNodes[i]).attr('y');
    if (cur - prev < MIN_GAP) {
      d3.select(lblNodes[i]).attr('y', prev + MIN_GAP);
    }
  }
}

function onLineHover(event) {
  if (!DATA) return;
  const [mx] = d3.pointer(event);
  const fi = Math.round(lX.invert(mx));
  const kf = DATA.keyframes[Math.min(fi, DATA.keyframes.length-1)];
  if (!kf) return;
  const top = DATA.participantes
    .map(p => ({nome:p.nome, pts:kf.pts[p.id]??0}))
    .sort((a,b)=>b.pts-a.pts).slice(0,5);
  const tip = document.getElementById('tooltip');
  tip.innerHTML = `<strong style="color:#eee">${kf.label}</strong><br>` +
    top.map((p,i)=>`<span style="color:${PALETTE[i]}">${i+1}. ${p.nome.split(' ')[0]}: ${p.pts}pts</span>`).join('<br>');
  tip.style.display = 'block';
  tip.style.left = (event.clientX+12)+'px';
  tip.style.top  = (event.clientY-10)+'px';
}

// ── EXPORT ──────────────────────────────────────────────────────────────────
function setStatus(msg) { document.getElementById('export-status').textContent = msg; }

function exportFrames() {
  // Exporta o SVG atual como PNG
  const svg = tab === 'bar'
    ? document.querySelector('#bar-container svg')
    : document.querySelector('#line-container svg');
  if (!svg) { setStatus('❌ Nenhum chart visível'); return; }
  const xml = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([xml], {type:'image/svg+xml'});
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `chartrace-jogo${getKFIndex()+1}.svg`;
  a.click();
  setStatus('✅ SVG baixado! Abra no browser e salve como PNG.');
}

function exportWebM() {
  if (isExporting) return;
  const svg = tab === 'bar'
    ? document.querySelector('#bar-container svg')
    : document.querySelector('#line-container svg');
  if (!svg) { setStatus('❌ Nenhum chart visível'); return; }

  // canvas do tamanho do SVG
  const W = svg.clientWidth || 820;
  const H = svg.clientHeight || 500;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // tenta MediaRecorder
  let stream, recorder, chunks = [];
  try {
    stream = canvas.captureStream(30);
    recorder = new MediaRecorder(stream, {mimeType:'video/webm;codecs=vp8',videoBitsPerSecond:2500000});
  } catch(e) { setStatus('❌ Seu browser não suporta gravação. Use Chrome.'); return; }

  recorder.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks,{type:'video/webm'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `chartrace-${window.CHARTRACE_BOLAO_ID}.webm`;
    a.click();
    setStatus('✅ WebM exportado! Envie como arquivo no WhatsApp.');
    isExporting = false;
  };

  isExporting = true;
  pause();
  const savedT = T;
  T = 0;
  recorder.start();
  setStatus('⏺ Gravando...');

  const FPS = 30;
  const DT = 1 / (T_PER_KF * FPS); // incremento de T por frame
  const maxT = DATA.keyframes.length - 0.001;

  function captureFrame() {
    if (!isExporting) return;
    T = Math.min(T + DT, maxT);
    curVals = getValsAt(T);
    updateHeader();
    if (tab === 'bar') renderBar(curVals); else renderLine(T);

    // desenha SVG no canvas
    const xml = new XMLSerializer().serializeToString(svg);
    const img = new Image();
    img.onload = () => {
      ctx.fillStyle = '#0d0d0f';
      ctx.fillRect(0,0,W,H);
      ctx.drawImage(img,0,0,W,H);
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);

    const pct = Math.round((T / maxT) * 100);
    setStatus(`⏺ Gravando... ${pct}%`);

    if (T >= maxT) {
      setTimeout(() => { recorder.stop(); T = savedT; }, 800);
    } else {
      requestAnimationFrame(captureFrame);
    }
  }
  requestAnimationFrame(captureFrame);
}

// ── RESIZE ──────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  if (!DATA) return;
  buildBarChart(); buildLineChart();
  renderBar(curVals); renderLine(T);
});
</script>

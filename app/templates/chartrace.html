<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart Race · {{ bolao.nome }}</title>

<!-- Open Graph para preview no WhatsApp -->
<meta property="og:title"       content="🏆 {{ bolao.nome }} — Chart Race">
<meta property="og:description" content="Veja o ranking animado do bolão jogo a jogo!">
<meta property="og:type"        content="website">
<meta property="og:url"         content="{{ request.url }}">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #eee; font-family: Arial, sans-serif; overflow-x: hidden; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React via CDN -->
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<script>
  // Variável renderizada pelo Jinja2 ANTES do bloco raw
  window.CHARTRACE_BOLAO_ID = {{ bolao.id }};
  window.CHARTRACE_BOLAO_NOME = "{{ bolao.nome | e }}";
</script>
<script type="text/babel">
{% raw %}
const { useState, useEffect, useRef, useCallback } = React;

const DATA_URL = `/chartrace/${window.CHARTRACE_BOLAO_ID}/data`;

const EMOJIS = ["🏆","⭐","⚽","🔥","💪","⚡","🎯","🌟","👟","🏅",
                 "🥅","💎","🚀","👑","🎪","🦁","🐯","🦊","🐻","🦅",
                 "🦋","🌈","⛰️","🏄","🎸","🎯","🧨","🎲","🏹","🎳"];
const CORES = [
  "#00a651","#3498db","#e74c3c","#f39c12","#9b59b6",
  "#1abc9c","#e67e22","#2980b9","#c0392b","#27ae60",
  "#8e44ad","#16a085","#d35400","#2c3e50","#7f8c8d",
  "#f1c40f","#e91e63","#00bcd4","#8bc34a","#ff5722",
  "#607d8b","#795548","#9e9e9e","#03a9f4","#4caf50",
  "#ff9800","#673ab7","#009688","#ffeb3b","#f44336"
];

const BAR_H = 50, BAR_GAP = 10, SLOT = BAR_H + BAR_GAP;

function App() {
  const [data, setData]       = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError]     = useState(null);
  const [kf, setKf]           = useState(0);
  const [playing, setPlaying] = useState(false);
  const [speed, setSpeed]     = useState(1.4);
  const [display, setDisplay] = useState({});

  const rafRef      = useRef(null);
  const playRef     = useRef(null);
  const kfRef       = useRef(0);
  const speedRef    = useRef(1.4);
  const fromRef     = useRef({});
  const toRef       = useRef({});
  const tRef        = useRef(0);
  const lastTsRef   = useRef(null);
  const playingRef  = useRef(false);
  const curRef      = useRef({});

  // Buscar dados
  useEffect(() => {
    fetch(DATA_URL)
      .then(r => r.json())
      .then(d => {
        setData(d);
        setLoading(false);
        // Inicializar display com zeros
        const zeros = {};
        d.participantes.forEach(p => { zeros[p.id] = 0; });
        setDisplay(zeros);
        curRef.current = zeros;
      })
      .catch(e => { setError(e.message); setLoading(false); });
  }, []);

  useEffect(() => { speedRef.current = speed; }, [speed]);

  const animate = useCallback((ts) => {
    if (!playingRef.current || !data) return;
    if (!lastTsRef.current) lastTsRef.current = ts;
    const dt = (ts - lastTsRef.current) / 1000;
    lastTsRef.current = ts;

    tRef.current = Math.min(tRef.current + dt / speedRef.current, 1);
    const e = tRef.current * tRef.current * (3 - 2 * tRef.current); // smooth step

    const novo = {};
    Object.keys(toRef.current).forEach(id => {
      const from = fromRef.current[id] ?? 0;
      const to   = toRef.current[id]   ?? 0;
      novo[id]   = from + (to - from) * e;
    });
    curRef.current = novo;
    setDisplay({...novo});

    if (tRef.current >= 1) {
      const next = kfRef.current + 1;
      if (next < data.keyframes.length) {
        fromRef.current = {...novo};
        toRef.current   = {...data.keyframes[next].pts};
        tRef.current    = 0;
        lastTsRef.current = null;
        kfRef.current   = next;
        setKf(next);
      } else {
        playingRef.current = false;
        setPlaying(false);
        return;
      }
    }
    rafRef.current = requestAnimationFrame(animate);
  }, [data]);

  const goTo = useCallback((idx, skipAnim = false) => {
    if (!data) return;
    const i = Math.max(0, Math.min(data.keyframes.length - 1, idx));
    const prevPts = i > 0 ? data.keyframes[i-1].pts : Object.fromEntries(data.participantes.map(p=>[p.id,0]));
    fromRef.current = {...prevPts};
    toRef.current   = {...data.keyframes[i].pts};
    tRef.current    = skipAnim ? 1 : 0;
    lastTsRef.current = null;
    kfRef.current   = i;
    setKf(i);
    if (skipAnim) {
      curRef.current = {...data.keyframes[i].pts};
      setDisplay({...data.keyframes[i].pts});
    }
  }, [data]);

  const startPlay = useCallback(() => {
    if (!data) return;
    if (kfRef.current >= data.keyframes.length - 1) {
      const zeros = Object.fromEntries(data.participantes.map(p=>[p.id,0]));
      curRef.current = zeros;
      fromRef.current = zeros;
      toRef.current = {...data.keyframes[0].pts};
      tRef.current = 0;
      lastTsRef.current = null;
      kfRef.current = 0;
      setKf(0);
      setDisplay(zeros);
    }
    playingRef.current = true;
    setPlaying(true);
    lastTsRef.current = null;
    rafRef.current = requestAnimationFrame(animate);
  }, [data, animate]);

  const pause = useCallback(() => {
    playingRef.current = false;
    setPlaying(false);
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
  }, []);

  useEffect(() => () => {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    clearInterval(playRef.current);
  }, []);

  if (loading) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",flexDirection:"column",gap:16}}>
      <div style={{fontSize:"2rem"}}>⏳</div>
      <div style={{color:"#666"}}>Carregando dados do bolão...</div>
    </div>
  );

  if (error || !data) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",flexDirection:"column",gap:16}}>
      <div style={{fontSize:"2rem"}}>❌</div>
      <div style={{color:"#e74c3c"}}>Erro ao carregar: {error}</div>
    </div>
  );

  if (!data.keyframes.length) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",flexDirection:"column",gap:16}}>
      <div style={{fontSize:"3rem"}}>⏳</div>
      <div style={{color:"#666",textAlign:"center",padding:"0 2rem"}}>
        <strong style={{color:"#eee",display:"block",marginBottom:8}}>{data.bolao}</strong>
        Nenhum jogo encerrado ainda. Volte após o início!
      </div>
    </div>
  );

  const parts      = data.participantes;
  const SHOW       = Math.min(parts.length, 10);
  const containerH = SHOW * SLOT;
  const curKF      = data.keyframes[kf] || {};

  // Ranking pelos pontos interpolados
  const sorted = [...parts]
    .map(p => ({ ...p, val: display[p.id] ?? 0 }))
    .sort((a,b) => b.val - a.val || a.id - b.id);

  const rankMap = {};
  sorted.forEach((p,i) => { rankMap[p.id] = i; });

  const maxVal = Math.max(...sorted.slice(0,SHOW).map(p=>p.val), 1);

  return (
    <div style={{background:"#111",minHeight:"100vh",padding:"1rem",display:"flex",flexDirection:"column",alignItems:"center"}}>

      {/* Header */}
      <div style={{textAlign:"center",marginBottom:"0.8rem",width:"100%",maxWidth:700}}>
        <div style={{fontSize:"1.3rem",fontWeight:700,marginBottom:"0.5rem"}}>
          🏆 {data.bolao}
        </div>
        <div style={{fontSize:"0.78rem",color:"#00a651",background:"#00a65115",
          padding:"0.3rem 0.8rem",borderRadius:20,display:"inline-block",
          border:"1px solid #00a65130",maxWidth:"95%",textAlign:"center",lineHeight:1.4}}>
          {curKF.label || ""}
        </div>
        <div style={{fontSize:"0.68rem",color:"#444",marginTop:"0.3rem"}}>
          Jogo {kf+1} de {data.keyframes.length}
        </div>
      </div>

      {/* Chart */}
      <div style={{width:"100%",maxWidth:700,position:"relative",height:containerH,overflow:"hidden",marginBottom:"1.2rem"}}>
        {parts.map((p, pi) => {
          const rank    = rankMap[p.id] ?? parts.length-1;
          const topPx   = rank * SLOT;
          const val     = display[p.id] ?? 0;
          const pct     = maxVal > 0 ? Math.max((val/maxVal)*100, 0) : 0;
          const cor     = CORES[pi % CORES.length];
          const emoji   = EMOJIS[pi % EMOJIS.length];
          const vis     = rank < SHOW;

          return (
            <div key={p.id} style={{
              position:"absolute", left:0, right:0,
              top: topPx, height: BAR_H,
              opacity: vis ? 1 : 0,
              display:"flex", alignItems:"center", gap:6,
            }}>
              {/* Avatar */}
              <div style={{
                width:38,height:38,borderRadius:"50%",
                background:`${cor}22`,border:`2px solid ${cor}`,
                display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:"1.1rem",flexShrink:0,
                boxShadow: rank===0 ? `0 0 10px ${cor}` : "none"
              }}>{emoji}</div>

              {/* Barra + nome */}
              <div style={{flex:1}}>
                <div style={{fontSize:"0.7rem",color:"#888",marginBottom:2,lineHeight:1,
                  whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:180}}>
                  {p.nome}
                </div>
                <div style={{height:26,borderRadius:4,background:"#1a1a1a",overflow:"hidden",position:"relative"}}>
                  <div style={{
                    position:"absolute",top:0,left:0,bottom:0,
                    width:`${pct}%`,
                    background:`linear-gradient(90deg,${cor}77,${cor})`,
                    borderRadius:4,
                    display:"flex",alignItems:"center",justifyContent:"flex-end",
                    paddingRight: pct>8?8:0,
                    minWidth: val>0.5 ? 48 : 0
                  }}>
                    {val>0.5 && <span style={{fontSize:"0.8rem",fontWeight:700,color:"#fff",whiteSpace:"nowrap"}}>{Math.round(val)}</span>}
                  </div>
                  {val<=0.5 && <span style={{position:"absolute",left:6,top:"50%",transform:"translateY(-50%)",fontSize:"0.7rem",color:"#333"}}>0</span>}
                </div>
              </div>

              {/* Posição */}
              <div style={{width:22,textAlign:"center",fontSize:"0.7rem",flexShrink:0,
                color: rank===0?"#FFD700":rank===1?"#C0C0C0":rank===2?"#CD7F32":"#555",
                fontWeight: rank<3?700:400}}>
                {rank+1}º
              </div>
            </div>
          );
        })}
      </div>

      {/* Controles */}
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",justifyContent:"center",marginBottom:"0.8rem"}}>
        <button onClick={()=>{pause();goTo(Math.max(0,kfRef.current-1),true);}}
          disabled={kf===0}
          style={{...btn, opacity:kf===0?0.4:1}}>←</button>

        <button onClick={()=>playing?pause():startPlay()}
          style={{...btn,background:playing?"#e74c3c":"#00a651",color:playing?"#fff":"#000",minWidth:90,fontWeight:700}}>
          {playing?"⏸ Pausar":kf>=data.keyframes.length-1?"🔄 Reiniciar":"▶ Play"}
        </button>

        <button onClick={()=>{pause();goTo(Math.min(data.keyframes.length-1,kfRef.current+1),true);}}
          disabled={kf>=data.keyframes.length-1}
          style={{...btn,opacity:kf>=data.keyframes.length-1?0.4:1}}>→</button>

        <div style={{display:"flex",gap:4}}>
          {[[2.5,"🐢"],[1.4,"🚶"],[0.8,"🏃"],[0.35,"⚡"]].map(([s,ic])=>(
            <button key={s} onClick={()=>setSpeed(s)}
              style={{...btn,background:Math.abs(speed-s)<0.05?"#00a651":"#1e1e1e",
                color:Math.abs(speed-s)<0.05?"#000":"#aaa",padding:"0.3rem 0.5rem",fontSize:"0.82rem"}}>
              {ic}
            </button>
          ))}
        </div>
      </div>

      {/* Slider */}
      <div style={{width:"100%",maxWidth:700,display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
        <span style={{fontSize:"0.65rem",color:"#333"}}>1</span>
        <input type="range" min={0} max={data.keyframes.length-1} value={kf}
          onChange={e=>{pause();goTo(Number(e.target.value),true);}}
          style={{flex:1,accentColor:"#00a651"}}/>
        <span style={{fontSize:"0.65rem",color:"#333"}}>{data.keyframes.length}</span>
      </div>

      {/* Bolinhas de jogos */}
      <div style={{width:"100%",maxWidth:700,display:"flex",gap:3,flexWrap:"wrap",justifyContent:"center"}}>
        {data.keyframes.map((_,i)=>(
          <div key={i} onClick={()=>{pause();goTo(i,true);}}
            title={data.keyframes[i].label}
            style={{width:12,height:12,borderRadius:"50%",cursor:"pointer",flexShrink:0,
              background:i===kf?"#00a651":i<kf?"#00a65155":"#222",
              border:i===kf?"2px solid #00a651":"1px solid #333"}}/>
        ))}
      </div>

      <div style={{marginTop:12,fontSize:"0.65rem",color:"#222",textAlign:"center"}}>
        erreidenovo.com.br
      </div>
    </div>
  );
}

const btn = {
  padding:"0.45rem 0.9rem",background:"#1e1e1e",
  color:"#aaa",border:"1px solid #333",borderRadius:6,
  cursor:"pointer",fontSize:"0.88rem"
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
{% endraw %}
</script>
</body>
</html>
